{% load ggds %}<nav class="ggds-tab-bar" aria-label="{% ggds_text "tabBar.label" %}">
  <ul class="ggds-tab-bar__list">
    {% for t in tabs %}<li><a class="ggds-tab-bar__link" href="{{ t.href }}"{% if t.current %} aria-current="page"{% endif %}>{{ t.icon_svg }}<span>{{ t.label }}</span></a></li>
    {% endfor %}
  </ul>
</nav>
