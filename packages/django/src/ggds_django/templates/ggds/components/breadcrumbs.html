{% load ggds %}{% if current %}<nav class="ggds-breadcrumbs" aria-label="{% ggds_text "breadcrumbs.label" %}">
  <ol class="ggds-breadcrumbs__list">
    {% for c in parents %}<li class="ggds-breadcrumbs__item"><a class="ggds-breadcrumbs__link" href="{{ c.href }}">{{ c.label }}</a></li>
    {% endfor %}<li class="ggds-breadcrumbs__item" aria-current="page">{{ current.label }}</li>
  </ol>
</nav>{% endif %}
