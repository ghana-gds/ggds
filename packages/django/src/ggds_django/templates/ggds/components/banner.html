<section class="ggds-banner{% if not official %} ggds-banner--unofficial{% endif %}" aria-label="{{ label }}">
  <details class="ggds-banner__details ggds-container">
    <summary class="ggds-banner__summary"><svg class="ggds-banner__flag" viewBox="0 0 30 20" aria-hidden="true" focusable="false"><rect class="ggds-banner__flag-red" width="30" height="6.67"/><rect class="ggds-banner__flag-gold" y="6.67" width="30" height="6.67"/><rect class="ggds-banner__flag-green" y="13.33" width="30" height="6.67"/><polygon class="ggds-banner__flag-star" points="15,6.8 15.73,8.99 18.04,9.01 16.19,10.39 16.88,12.59 15,11.25 13.12,12.59 13.81,10.39 11.96,9.01 14.27,8.99"/></svg><span class="ggds-banner__text">{{ summary }}</span> <span class="ggds-banner__toggle">{{ how_to_tell }}</span></summary>
    <div class="ggds-banner__content">
      <div class="ggds-banner__item"><p class="ggds-banner__heading">{{ check_address }}</p><p>{{ address }} {{ domain }}{% if register %} {{ register }}{% endif %}</p></div>
      <div class="ggds-banner__item"><p class="ggds-banner__heading">{{ padlock_heading }}</p><p>{{ padlock }}</p></div>
      <div class="ggds-banner__item"><p class="ggds-banner__heading">{{ pin_heading }}</p><p>{{ pin }}</p></div>
    </div>
  </details>
</section>
