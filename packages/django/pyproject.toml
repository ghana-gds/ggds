[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ggds-django"
version = "0.4.0"
description = "Ghana Government Design System (GGDS) for Django: page parts as template tags, a form renderer, and the GGDS styles and script."
readme = "README.md"
license = "Apache-2.0"
# Copied in from the repository root by scripts/package-files.mjs (pnpm run pack:django); not committed here.
license-files = ["LICENSE", "LICENSE.md"]
requires-python = ">=3.10"
dependencies = ["django>=5.0"]
classifiers = ["Framework :: Django", "Framework :: Django :: 5.0", "Framework :: Django :: 6.0"]

[project.urls]
Documentation = "https://github.com/ghana-gds/ggds"

[tool.hatch.build.targets.wheel]
packages = ["src/ggds_django"]
# The static files are copied in by build.mjs (pnpm run build) before the package is built.
artifacts = ["src/ggds_django/static/**", "src/ggds_django/icons.json", "src/ggds_django/strings.json", "src/ggds_django/locale/**"]
