<!-- title: Password to sign in; layout: main; height: 260 -->
<div class="ggds-field ggds-password-input" data-ggds-module="password-input">
  <label class="ggds-label" for="password">Password</label>
  <div class="ggds-password-input__wrapper">
    <input class="ggds-input ggds-password-input__input" id="password" name="password" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="none">
    <button class="ggds-button ggds-button--secondary ggds-password-input__toggle" type="button" aria-controls="password" aria-label="Show password" hidden>Show</button>
  </div>
</div>
