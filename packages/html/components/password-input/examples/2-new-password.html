<!-- title: Create a password, with an error; layout: main; height: 320 -->
<div class="ggds-field ggds-field--error ggds-password-input" data-ggds-module="password-input">
  <label class="ggds-label" for="new-password">Create a password</label>
  <p class="ggds-hint" id="new-password-hint">At least 8 characters</p>
  <p class="ggds-error-message" id="new-password-error"><span class="ggds-visually-hidden">Error:</span> Your password must have at least 8 characters</p>
  <div class="ggds-password-input__wrapper">
    <input class="ggds-input ggds-password-input__input" id="new-password" name="newPassword" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" aria-describedby="new-password-hint new-password-error" aria-invalid="true">
    <button class="ggds-button ggds-button--secondary ggds-password-input__toggle" type="button" aria-controls="new-password" aria-label="Show password" hidden>Show</button>
  </div>
</div>
