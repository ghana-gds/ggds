<p class="ggds-lead">A short label that shows a status, such as "Open" or "Closed".</p>
<h2>When to use</h2>
<ul><li>To show the status of an item in a list or on a page.</li></ul>
<h2>When not to use</h2>
<ul><li>As a link or button.</li></ul>
<h2>How to use</h2>
<ul><li>Use one or two words.</li></ul>
<h2>Accessibility</h2>
<ul><li>The words carry the meaning. The colour only supports them.</li></ul>
