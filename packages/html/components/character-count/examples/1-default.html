<!-- title: Character count; layout: main; height: 360 -->
<div class="ggds-field ggds-character-count" data-ggds-module="character-count" data-ggds-max="500">
  <label class="ggds-label" for="details">Describe the problem</label>
  <p class="ggds-hint" id="details-hint">Include dates, amounts and any reference numbers</p>
  <textarea class="ggds-textarea" id="details" name="details" rows="5" aria-describedby="details-hint details-info"></textarea>
  <p class="ggds-hint ggds-character-count__message" id="details-info">You can enter up to 500 characters</p>
</div>
