<!-- title: Too many characters, after sending; layout: main; height: 420 -->
<div class="ggds-field ggds-field--error ggds-character-count" data-ggds-module="character-count" data-ggds-max="100">
  <label class="ggds-label" for="summary">Summarise the problem</label>
  <p class="ggds-error-message" id="summary-error"><span class="ggds-visually-hidden">Error:</span> The summary must be 100 characters or fewer</p>
  <textarea class="ggds-textarea" id="summary" name="summary" rows="3" aria-describedby="summary-error summary-info" aria-invalid="true">My mobile money transfer of GH₵ 250 on 3 November did not arrive, and the agent says the network has the money.</textarea>
  <p class="ggds-hint ggds-character-count__message" id="summary-info">You can enter up to 100 characters</p>
</div>
