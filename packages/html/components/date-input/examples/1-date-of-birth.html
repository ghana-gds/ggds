<!-- title: Date of birth; layout: main; height: 260 -->
<div class="ggds-field">
  <fieldset class="ggds-fieldset" role="group" aria-describedby="dob-hint">
    <legend class="ggds-fieldset__legend">What is your date of birth?</legend>
    <p class="ggds-hint" id="dob-hint">For example, 27 3 1990</p>
    <div class="ggds-date-input">
      <div class="ggds-date-input__item">
        <label class="ggds-date-input__label" for="dob-day">Day</label>
        <input class="ggds-input ggds-date-input__input" id="dob-day" name="dobDay" type="text" inputmode="numeric" autocomplete="bday-day" spellcheck="false">
      </div>
      <div class="ggds-date-input__item">
        <label class="ggds-date-input__label" for="dob-month">Month</label>
        <input class="ggds-input ggds-date-input__input" id="dob-month" name="dobMonth" type="text" inputmode="numeric" autocomplete="bday-month" spellcheck="false">
      </div>
      <div class="ggds-date-input__item">
        <label class="ggds-date-input__label" for="dob-year">Year</label>
        <input class="ggds-input ggds-date-input__input ggds-date-input__input--year" id="dob-year" name="dobYear" type="text" inputmode="numeric" autocomplete="bday-year" spellcheck="false">
      </div>
    </div>
  </fieldset>
</div>
