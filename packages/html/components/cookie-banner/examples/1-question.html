<!-- title: Cookie banner; layout: bare; height: 360 -->
<div class="ggds-cookie-banner" role="region" aria-label="Cookies on Example Agency">
  <div class="ggds-container ggds-cookie-banner__inner">
    <h2 class="ggds-cookie-banner__title">Cookies on Example Agency</h2>
    <div class="ggds-cookie-banner__body">
      <p>We use some essential cookies to make this website work.</p>
      <p>We would also like to use analytics cookies to understand how you use the website, so we can improve it.</p>
    </div>
    <form class="ggds-cookie-banner__actions" method="post" action="/cookies/">
      <button class="ggds-button" type="submit" name="cookies" value="accept">Accept analytics cookies</button>
      <button class="ggds-button" type="submit" name="cookies" value="reject">Reject analytics cookies</button>
      <a href="/cookies/">View cookies</a>
    </form>
  </div>
</div>
