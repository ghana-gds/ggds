<!-- title: Meters in a table; layout: main; height: 380 -->
<div class="ggds-table-wrap" role="region" aria-labelledby="rain-caption" tabindex="0">
  <table class="ggds-table">
    <caption class="ggds-table__caption" id="rain-caption">Rainfall by region, April to July 2026, in millimetres</caption>
    <thead>
      <tr>
        <th scope="col">Region</th>
        <th scope="col" class="ggds-table__numeric">Rainfall</th>
        <th scope="col"><span class="ggds-visually-hidden">Rainfall as a bar</span></th>
        <th scope="col" class="ggds-table__numeric">Normal</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Western</th>
        <td class="ggds-table__numeric">1020</td>
        <td><meter class="ggds-meter" min="0" max="1100" value="1020" aria-hidden="true">1020 mm</meter></td>
        <td class="ggds-table__numeric">880</td>
      </tr>
      <tr>
        <th scope="row">Volta</th>
        <td class="ggds-table__numeric">812</td>
        <td><meter class="ggds-meter" min="0" max="1100" value="812" aria-hidden="true">812 mm</meter></td>
        <td class="ggds-table__numeric">700</td>
      </tr>
      <tr>
        <th scope="row">Ashanti</th>
        <td class="ggds-table__numeric">744</td>
        <td><meter class="ggds-meter" min="0" max="1100" value="744" aria-hidden="true">744 mm</meter></td>
        <td class="ggds-table__numeric">770</td>
      </tr>
      <tr>
        <th scope="row">Greater Accra</th>
        <td class="ggds-table__numeric">512</td>
        <td><meter class="ggds-meter" min="0" max="1100" value="512" aria-hidden="true">512 mm</meter></td>
        <td class="ggds-table__numeric">430</td>
      </tr>
    </tbody>
  </table>
</div>
<p class="ggds-hint">Example figures only.</p>
