<!-- title: A code sent by SMS; layout: main; height: 320 -->
<div class="ggds-field">
  <label class="ggds-label" for="code">Enter the code we sent you</label>
  <p class="ggds-hint" id="code-hint">We sent a 6-digit code to 024 *** 4567. It expires in 10 minutes.</p>
  <input class="ggds-input ggds-input--code" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" aria-describedby="code-hint">
</div>
<p><a href="#code">Send a new code</a></p>
<button class="ggds-button" type="submit">Continue</button>
