<!-- title: A code that has expired; layout: main; height: 340 -->
<div class="ggds-field ggds-field--error">
  <label class="ggds-label" for="expired-code">Enter the code we sent you</label>
  <p class="ggds-hint" id="expired-code-hint">We sent a 6-digit code to 024 *** 4567. It expires in 10 minutes.</p>
  <p class="ggds-error-message" id="expired-code-error"><span class="ggds-visually-hidden">Error:</span> The code has expired. Send a new code</p>
  <input class="ggds-input ggds-input--code" id="expired-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" aria-describedby="expired-code-hint expired-code-error" aria-invalid="true" value="482 913">
</div>
<p><a href="#expired-code">Send a new code</a></p>
<button class="ggds-button" type="submit">Continue</button>
