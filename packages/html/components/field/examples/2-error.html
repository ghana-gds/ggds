<!-- title: Text input with an error; layout: main; height: 230 -->
<div class="ggds-field ggds-field--error">
  <label class="ggds-label" for="phone">Mobile phone number</label>
  <p class="ggds-hint" id="phone-hint">For example, 024 123 4567</p>
  <p class="ggds-error-message" id="phone-error"><span class="ggds-visually-hidden">Error:</span> Enter a mobile phone number with 10 digits, like 024 123 4567</p>
  <input class="ggds-input ggds-input--width-medium" id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" aria-invalid="true" aria-describedby="phone-hint phone-error" value="024 123">
</div>
