<!-- title: States: normal, focus and disabled; layout: main; height: 420; states: true -->
<p class="docs-state-label">Normal (point at a button to see its hover colour)</p>
<div class="ggds-button-group">
  <button class="ggds-button" type="button">Continue</button>
  <button class="ggds-button ggds-button--secondary" type="button">Save as draft</button>
  <button class="ggds-button ggds-button--quiet" type="button">Cancel</button>
  <button class="ggds-button ggds-button--warning" type="button">Withdraw application</button>
</div>
<p class="docs-state-label">Focus (what keyboard users see)</p>
<div class="ggds-button-group">
  <button class="ggds-button docs-state-focus" type="button">Continue</button>
  <button class="ggds-button ggds-button--secondary docs-state-focus" type="button">Save as draft</button>
  <button class="ggds-button ggds-button--quiet docs-state-focus" type="button">Cancel</button>
  <button class="ggds-button ggds-button--warning docs-state-focus" type="button">Withdraw application</button>
</div>
<p class="docs-state-label">Disabled (avoid where you can)</p>
<div class="ggds-button-group">
  <button class="ggds-button" type="button" disabled>Continue</button>
  <button class="ggds-button ggds-button--secondary" type="button" aria-disabled="true">Save as draft</button>
</div>
