<!-- title: Radios; layout: main; height: 260 -->
<div class="ggds-field">
  <fieldset class="ggds-fieldset" aria-describedby="contact-hint">
    <legend class="ggds-fieldset__legend">How should we contact you?</legend>
    <p class="ggds-hint" id="contact-hint">Choose one</p>
    <div class="ggds-choices">
      <div class="ggds-choice">
        <input class="ggds-choice__input" id="contact-call" name="contact" type="radio" value="call">
        <label class="ggds-choice__label" for="contact-call">Phone call</label>
      </div>
      <div class="ggds-choice">
        <input class="ggds-choice__input" id="contact-sms" name="contact" type="radio" value="sms">
        <label class="ggds-choice__label" for="contact-sms">SMS</label>
      </div>
      <div class="ggds-choice">
        <input class="ggds-choice__input" id="contact-email" name="contact" type="radio" value="email" aria-describedby="contact-email-hint">
        <label class="ggds-choice__label" for="contact-email">Email <span class="ggds-choice__hint" id="contact-email-hint">We reply within 5 working days</span></label>
      </div>
    </div>
  </fieldset>
</div>
