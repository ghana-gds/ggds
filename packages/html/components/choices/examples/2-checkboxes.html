<!-- title: Checkboxes; layout: main; height: 260 -->
<div class="ggds-field">
  <fieldset class="ggds-fieldset" aria-describedby="services-hint">
    <legend class="ggds-fieldset__legend">Which services does your business offer?</legend>
    <p class="ggds-hint" id="services-hint">Select all that apply</p>
    <div class="ggds-choices">
      <div class="ggds-choice">
        <input class="ggds-choice__input" id="services-internet" name="services" type="checkbox" value="internet">
        <label class="ggds-choice__label" for="services-internet">Internet access</label>
      </div>
      <div class="ggds-choice">
        <input class="ggds-choice__input" id="services-voice" name="services" type="checkbox" value="voice">
        <label class="ggds-choice__label" for="services-voice">Voice calls</label>
      </div>
      <div class="ggds-choice">
        <input class="ggds-choice__input" id="services-broadcast" name="services" type="checkbox" value="broadcast">
        <label class="ggds-choice__label" for="services-broadcast">Broadcasting</label>
      </div>
    </div>
  </fieldset>
</div>
