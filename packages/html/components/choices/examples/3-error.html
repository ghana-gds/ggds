<!-- title: Radios with an error; layout: main; height: 260 -->
<div class="ggds-field ggds-field--error">
  <fieldset class="ggds-fieldset" aria-describedby="contacted-error">
    <legend class="ggds-fieldset__legend">Have you contacted your provider about this problem?</legend>
    <p class="ggds-error-message" id="contacted-error"><span class="ggds-visually-hidden">Error:</span> Select yes if you have contacted your provider</p>
    <div class="ggds-choices ggds-choices--inline">
      <div class="ggds-choice">
        <input class="ggds-choice__input" id="contacted-yes" name="contacted" type="radio" value="yes">
        <label class="ggds-choice__label" for="contacted-yes">Yes</label>
      </div>
      <div class="ggds-choice">
        <input class="ggds-choice__input" id="contacted-no" name="contacted" type="radio" value="no">
        <label class="ggds-choice__label" for="contacted-no">No</label>
      </div>
    </div>
  </fieldset>
</div>
