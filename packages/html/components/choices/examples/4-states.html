<!-- title: States: not chosen, chosen and focus; layout: main; height: 300; states: true -->
<div class="ggds-field">
  <fieldset class="ggds-fieldset">
    <legend class="ggds-fieldset__legend">Which updates do you want?</legend>
    <div class="ggds-choices">
      <div class="ggds-choice">
        <input class="ggds-choice__input" id="updates-news" name="updates" type="checkbox" value="news">
        <label class="ggds-choice__label" for="updates-news">News (not chosen)</label>
      </div>
      <div class="ggds-choice">
        <input class="ggds-choice__input" id="updates-fees" name="updates" type="checkbox" value="fees" checked>
        <label class="ggds-choice__label" for="updates-fees">Fee changes (chosen)</label>
      </div>
      <div class="ggds-choice">
        <input class="ggds-choice__input docs-state-focus" id="updates-jobs" name="updates" type="checkbox" value="jobs">
        <label class="ggds-choice__label" for="updates-jobs">Jobs (focus: what keyboard users see)</label>
      </div>
    </div>
  </fieldset>
</div>
