<!-- title: A question page; layout: main; height: 400 -->
<p><a href="/apply/address/">Back</a></p>
<form action="/apply/email/" method="post" novalidate>
  <div class="ggds-field">
    <h1><label class="ggds-label ggds-label--page" for="phone-number">What is your phone number?</label></h1>
    <p class="ggds-hint" id="phone-number-hint">We will send you an SMS when we have made a decision. For example, 024 000 0000 or +233 24 000 0000.</p>
    <input class="ggds-input ggds-input--width-medium" id="phone-number" name="phone" type="tel" autocomplete="tel" inputmode="tel" aria-describedby="phone-number-hint">
  </div>
  <button class="ggds-button" type="submit">Continue</button>
</form>
