<!-- title: The mobile money number; layout: main; height: 420 -->
<a class="ggds-back-link" href="/pay/">Back</a>
<form action="/pay/number/" method="post" novalidate>
  <div class="ggds-field">
    <h1><label class="ggds-label ggds-label--page" for="pay-number">What is your MTN MoMo number?</label></h1>
    <p class="ggds-hint" id="pay-number-hint">We will send a request for GH₵ 150.00 to this number. For example, 024 000 0000.</p>
    <input class="ggds-input ggds-input--width-medium" id="pay-number" name="number" type="tel" autocomplete="tel" inputmode="tel" aria-describedby="pay-number-hint" value="024 123 4567">
  </div>
  <button class="ggds-button" type="submit">Pay GH₵ 150.00</button>
</form>
