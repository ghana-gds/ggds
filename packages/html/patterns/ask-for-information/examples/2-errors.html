<!-- title: A question page after a failed submit; layout: main; height: 640 -->
<div class="ggds-error-summary" data-ggds-module="error-summary" role="alert" aria-labelledby="pattern-error-title" tabindex="-1">
  <h2 class="ggds-error-summary__title" id="pattern-error-title">There is a problem</h2>
  <ul class="ggds-error-summary__list">
    <li><a href="#contact-phone">Enter a mobile number with 10 digits, like 024 123 4567</a></li>
  </ul>
</div>
<h1>Your contact details</h1>
<form action="/complaints/check/" method="post" novalidate>
  <div class="ggds-field">
    <label class="ggds-label" for="contact-name">Full name</label>
    <input class="ggds-input ggds-input--width-long" id="contact-name" name="name" type="text" autocomplete="name" spellcheck="false" value="Ama Owusu">
  </div>
  <div class="ggds-field ggds-field--error">
    <label class="ggds-label" for="contact-phone">Mobile number</label>
    <p class="ggds-hint" id="contact-phone-hint">We use it only to call you about this complaint.</p>
    <p class="ggds-error-message" id="contact-phone-error"><span class="ggds-visually-hidden">Error:</span> Enter a mobile number with 10 digits, like 024 123 4567</p>
    <input class="ggds-input ggds-input--width-medium" id="contact-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" aria-invalid="true" aria-describedby="contact-phone-hint contact-phone-error" value="024 12">
  </div>
  <button class="ggds-button" type="submit">Continue</button>
</form>
