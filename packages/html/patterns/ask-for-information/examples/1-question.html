<!-- title: A question page; layout: main; height: 460 -->
<p><a href="/complaints/start/">Back</a></p>
<form action="/complaints/details/" method="post" novalidate>
  <div class="ggds-field">
    <fieldset class="ggds-fieldset" aria-describedby="network-hint">
      <legend class="ggds-fieldset__legend ggds-fieldset__legend--page"><h1>Which network are you complaining about?</h1></legend>
      <p class="ggds-hint" id="network-hint">If it is about more than one, make a complaint for each.</p>
      <div class="ggds-choices">
        <div class="ggds-choice"><input class="ggds-choice__input" id="network-mtn" name="network" type="radio" value="mtn"><label class="ggds-choice__label" for="network-mtn">MTN</label></div>
        <div class="ggds-choice"><input class="ggds-choice__input" id="network-telecel" name="network" type="radio" value="telecel"><label class="ggds-choice__label" for="network-telecel">Telecel</label></div>
        <div class="ggds-choice"><input class="ggds-choice__input" id="network-at" name="network" type="radio" value="at"><label class="ggds-choice__label" for="network-at">AT</label></div>
        <div class="ggds-choice"><input class="ggds-choice__input" id="network-other" name="network" type="radio" value="other"><label class="ggds-choice__label" for="network-other">Another provider</label></div>
      </div>
    </fieldset>
  </div>
  <button class="ggds-button" type="submit">Continue</button>
</form>
