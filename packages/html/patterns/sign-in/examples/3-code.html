<!-- title: Check it is them with a code; layout: main; height: 520 -->
<a class="ggds-back-link" href="/sign-in/">Back</a>
<h1>Check your phone</h1>
<form action="/sign-in/code/" method="post" novalidate>
  <div class="ggds-field">
    <label class="ggds-label" for="signin-code">Enter the code we sent you</label>
    <p class="ggds-hint" id="signin-code-hint">We sent a 6-digit code to 024 *** 4567. It expires in 10 minutes.</p>
    <input class="ggds-input ggds-input--code" id="signin-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" aria-describedby="signin-code-hint">
  </div>
  <button class="ggds-button" type="submit">Continue</button>
</form>
<p><a href="/sign-in/code/new/">Send a new code</a></p>
<p><a href="/sign-in/code/email/">Get a code by email instead</a></p>
