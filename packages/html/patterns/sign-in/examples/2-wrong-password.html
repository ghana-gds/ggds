<!-- title: Wrong phone number or password; layout: main; height: 640 -->
<div class="ggds-error-summary" data-ggds-module="error-summary" role="alert" aria-labelledby="signin-error-title" tabindex="-1">
  <h2 class="ggds-error-summary__title" id="signin-error-title">There is a problem</h2>
  <ul class="ggds-error-summary__list"><li><a href="#signin-wrong-phone">The phone number or password is not right</a></li></ul>
</div>
<h1>Sign in to your business account</h1>
<form action="/sign-in/" method="post" novalidate>
  <div class="ggds-field ggds-field--error">
    <label class="ggds-label" for="signin-wrong-phone">Phone number</label>
    <p class="ggds-error-message" id="signin-wrong-phone-error"><span class="ggds-visually-hidden">Error:</span> The phone number or password is not right</p>
    <input class="ggds-input ggds-input--width-medium" id="signin-wrong-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" aria-describedby="signin-wrong-phone-error" aria-invalid="true" value="024 123 4567">
  </div>
  <div class="ggds-field ggds-password-input" data-ggds-module="password-input">
    <label class="ggds-label" for="signin-wrong-password">Password</label>
    <div class="ggds-password-input__wrapper">
      <input class="ggds-input ggds-password-input__input" id="signin-wrong-password" name="password" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="none">
      <button class="ggds-button ggds-button--secondary ggds-password-input__toggle" type="button" aria-controls="signin-wrong-password" aria-label="Show password" hidden>Show</button>
    </div>
  </div>
  <button class="ggds-button" type="submit">Sign in</button>
</form>
<p><a href="/sign-in/forgotten-password/">Forgotten your password?</a></p>
