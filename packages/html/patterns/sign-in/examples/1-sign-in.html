<!-- title: The sign-in page; layout: main; height: 560 -->
<h1>Sign in to your business account</h1>
<form action="/sign-in/" method="post" novalidate>
  <div class="ggds-field">
    <label class="ggds-label" for="signin-phone">Phone number</label>
    <p class="ggds-hint" id="signin-phone-hint">The number you used to create your account</p>
    <input class="ggds-input ggds-input--width-medium" id="signin-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" aria-describedby="signin-phone-hint">
  </div>
  <div class="ggds-field ggds-password-input" data-ggds-module="password-input">
    <label class="ggds-label" for="signin-password">Password</label>
    <div class="ggds-password-input__wrapper">
      <input class="ggds-input ggds-password-input__input" id="signin-password" name="password" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="none">
      <button class="ggds-button ggds-button--secondary ggds-password-input__toggle" type="button" aria-controls="signin-password" aria-label="Show password" hidden>Show</button>
    </div>
  </div>
  <button class="ggds-button" type="submit">Sign in</button>
</form>
<p><a href="/sign-in/forgotten-password/">Forgotten your password?</a></p>
<p>No account yet? <a href="/create-account/">Create an account</a>.</p>
