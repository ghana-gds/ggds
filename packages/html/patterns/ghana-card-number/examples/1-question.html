<!-- title: A question page; layout: main; height: 420 -->
<p><a href="/apply/name/">Back</a></p>
<form action="/apply/date-of-birth/" method="post" novalidate>
  <div class="ggds-field">
    <h1><label class="ggds-label ggds-label--page" for="ghana-card">What is your Ghana Card number?</label></h1>
    <p class="ggds-hint" id="ghana-card-hint">We use it to confirm who you are with the National Identification Authority (NIA). It starts with GHA, such as GHA-000000000-0.</p>
    <input class="ggds-input ggds-input--width-medium" id="ghana-card" name="ghanaCardNumber" type="text" autocomplete="off" spellcheck="false" autocapitalize="characters" aria-describedby="ghana-card-hint">
  </div>
  <p><a href="/apply/other-id/">I do not have a Ghana Card yet</a></p>
  <button class="ggds-button" type="submit">Continue</button>
</form>
