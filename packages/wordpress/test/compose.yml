# A throwaway WordPress with the GGDS theme and GGDS Switch (and, for the switch tests, a stand-in heavy theme and
# page builder), for scripts/test-wordpress.mjs. Not for production.
name: ggds-wordpress-test
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60
  wordpress:
    image: wordpress:6.8-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8089:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ../ggds:/var/www/html/wp-content/themes/ggds:ro
      - ../ggds-switch:/var/www/html/wp-content/plugins/ggds-switch:ro
      - ./bloated:/var/www/html/wp-content/themes/bloated:ro
      - ./fake-builder:/var/www/html/wp-content/plugins/fake-builder:ro
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ../ggds:/var/www/html/wp-content/themes/ggds:ro
      - ../ggds-switch:/var/www/html/wp-content/plugins/ggds-switch:ro
      - ./bloated:/var/www/html/wp-content/themes/bloated:ro
      - ./fake-builder:/var/www/html/wp-content/plugins/fake-builder:ro
volumes:
  wp:
