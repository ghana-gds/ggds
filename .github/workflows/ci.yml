# Every push and pull request: build, unit tests, then accessibility and behaviour tests in Chrome.
# After the tests pass on main, the documentation website is published to GitHub Pages
# (https://ghana-gds.github.io/ggds/), without the example sites.
# The example sites need the MoCDTI platform folder (GGDS_PLATFORM_DIR), which is not in this repository, so
# CI skips them; run the full suite locally before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # uv makes ggds-django's Python environment; without it pnpm test skips the Django tests and example pages.
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm run release
      - run: pnpm run pack:npm
      - run: pnpm run pack:django
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # The documentation website, from main only and only after every test has passed.
  docs:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # publish to GitHub Pages
      id-token: write   # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@v4
